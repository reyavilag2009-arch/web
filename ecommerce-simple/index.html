<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopStore - E-commerce</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        /* Header */
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 1rem 0; position: sticky; top: 0; z-index: 100; }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.8rem; font-weight: bold; }
        .cart-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 0.6rem 1.2rem; border-radius: 25px; cursor: pointer; font-size: 1rem; position: relative; }
        .cart-badge { position: absolute; top: -8px; right: -8px; background: #ff4757; color: white; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; }
        
        /* Hero */
        .hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 4rem 0; text-align: center; }
        .hero h2 { font-size: 2.5rem; margin-bottom: 1rem; }
        .hero p { font-size: 1.2rem; opacity: 0.9; }
        
        /* Products */
        main { padding: 3rem 0; }
        .section-title { font-size: 2rem; margin-bottom: 2rem; color: #333; text-align: center; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
        .product-card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.3s ease; }
        .product-card:hover { transform: translateY(-5px); }
        .product-image { width: 100%; height: 250px; object-fit: cover; }
        .product-info { padding: 1.5rem; }
        .product-info h3 { font-size: 1.2rem; margin-bottom: 0.5rem; }
        .product-category { color: #667eea; font-size: 0.9rem; margin-bottom: 0.5rem; }
        .product-price { font-size: 1.5rem; font-weight: bold; color: #333; margin-bottom: 1rem; }
        .add-to-cart-btn { width: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 0.8rem; border-radius: 8px; font-size: 1rem; cursor: pointer; }
        .add-to-cart-btn:hover { box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); }
        
        /* Cart Modal */
        .cart-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: flex-end; }
        .cart-modal.active { display: flex; }
        .cart-sidebar { background: white; width: 400px; max-width: 90%; height: 100%; display: flex; flex-direction: column; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem; border-bottom: 1px solid #eee; }
        .close-btn { background: none; border: none; font-size: 2rem; cursor: pointer; color: #999; }
        .cart-items { flex: 1; overflow-y: auto; padding: 1rem; }
        .cart-item { display: flex; gap: 1rem; padding: 1rem; border-bottom: 1px solid #eee; }
        .cart-item-image { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; }
        .cart-item-details { flex: 1; }
        .quantity-controls { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; }
        .quantity-controls button { background: #f0f0f0; border: none; width: 30px; height: 30px; border-radius: 5px; cursor: pointer; }
        .remove-btn { background: none; border: none; font-size: 1.5rem; color: #ff4757; cursor: pointer; }
        .cart-footer { padding: 1.5rem; border-top: 1px solid #eee; }
        .cart-total { display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: bold; margin-bottom: 1rem; }
        .checkout-btn { width: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 1rem; border-radius: 8px; font-size: 1.1rem; cursor: pointer; }
        
        /* Footer */
        .footer { background: #333; color: white; padding: 2rem 0; text-align: center; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <h1 class="logo">🛒 ShopStore</h1>
            <button class="cart-btn" onclick="toggleCart()">
                🛒 Carrito <span class="cart-badge" id="cartBadge">0</span>
            </button>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h2>Bienvenido a ShopStore</h2>
            <p>Encuentra los mejores productos al mejor precio</p>
        </div>
    </section>

    <main class="container">
        <h2 class="section-title">Nuestros Productos</h2>
        <div class="products-grid" id="productsGrid"></div>
    </main>

    <div class="cart-modal" id="cartModal">
        <div class="cart-sidebar">
            <div class="cart-header">
                <h2>Tu Carrito</h2>
                <button class="close-btn" onclick="toggleCart()">×</button>
            </div>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Total:</span>
                    <span id="cartTotal">$0.00</span>
                </div>
                <button class="checkout-btn" onclick="alert('¡Gracias por tu compra!')">Proceder al Pago</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 ShopStore. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script>
        const products = [
            { id: 1, name: 'Auriculares Wireless', price: 59.99, image: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300&h=300&fit=crop', category: 'Electrónica' },
            { id: 2, name: 'Reloj Inteligente', price: 129.99, image: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300&h=300&fit=crop', category: 'Accesorios' },
            { id: 3, name: 'Cámara Instantánea', price: 89.99, image: 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=300&h=300&fit=crop', category: 'Fotografía' },
            { id: 4, name: 'Zapatillas Deportivas', price: 79.99, image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300&h=300&fit=crop', category: 'Deportes' },
            { id: 5, name: 'Gafas de Sol', price: 45.99, image: 'https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=300&h=300&fit=crop', category: 'Accesorios' },
            { id: 6, name: 'Mochila Urbana', price: 55.99, image: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=300&h=300&fit=crop', category: 'Viajes' }
        ];

        let cart = [];

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = products.map(product => `
                <div class="product-card">
                    <img src="${product.image}" alt="${product.name}" class="product-image">
                    <div class="product-info">
                        <h3>${product.name}</h3>
                        <p class="product-category">${product.category}</p>
                        <p class="product-price">$${product.price.toFixed(2)}</p>
                        <button class="add-to-cart-btn" onclick="addToCart(${product.id})">Añadir al Carrito</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);
            
            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            
            updateCart();
            toggleCart(true);
        }

        function updateQuantity(productId, change) {
            const item = cart.find(item => item.id === productId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== productId);
                }
            }
            updateCart();
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCart();
        }

        function updateCart() {
            const cartItems = document.getElementById('cartItems');
            const cartBadge = document.getElementById('cartBadge');
            const cartTotal = document.getElementById('cartTotal');
            
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            cartBadge.textContent = totalItems;
            cartTotal.textContent = `$${totalPrice.toFixed(2)}`;
            
            if (cart.length === 0) {
                cartItems.innerHTML = '<p style="text-align:center;color:#999;padding:2rem;">Tu carrito está vacío</p>';
            } else {
                cartItems.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.name}" class="cart-item-image">
                        <div class="cart-item-details">
                            <h4>${item.name}</h4>
                            <p>$${item.price.toFixed(2)}</p>
                            <div class="quantity-controls">
                                <button onclick="updateQuantity(${item.id}, -1)">-</button>
                                <span>${item.quantity}</span>
                                <button onclick="updateQuantity(${item.id}, 1)">+</button>
                            </div>
                        </div>
                        <button class="remove-btn" onclick="removeFromCart(${item.id})">×</button>
                    </div>
                `).join('');
            }
        }

        function toggleCart(forceOpen = null) {
            const modal = document.getElementById('cartModal');
            if (forceOpen === true) {
                modal.classList.add('active');
            } else if (forceOpen === false) {
                modal.classList.remove('active');
            } else {
                modal.classList.toggle('active');
            }
        }

        document.getElementById('cartModal').addEventListener('click', function(e) {
            if (e.target === this) toggleCart(false);
        });

        renderProducts();
        updateCart();
    </script>
</body>
</html>
